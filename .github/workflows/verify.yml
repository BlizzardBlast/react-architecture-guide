name: Verify

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:

# One batched job, not a job per tool or check. Draft PRs wait until ready.
permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/orders/package-lock.json
            examples/react-app/package-lock.json
      - name: Install pinned dependencies
        run: |
          npm ci --no-audit --no-fund
          npm --prefix examples/orders ci --no-audit --no-fund
          npm --prefix examples/react-app ci --no-audit --no-fund
      - name: Lint, unit tests, docs, boundaries, typecheck, production build
        run: npm run verify
      - name: Audit all three dependency trees
        run: |
          npm audit
          npm --prefix examples/orders audit
          npm --prefix examples/react-app audit
